name: Build macOS App

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  workflow_dispatch: {}

jobs:
  build-macos:
    runs-on: macos-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compilar con PyInstaller
        run: |
          pyinstaller --windowed --name RenombradorXML app.py

      - name: Firma ad-hoc (evita algunos bloqueos de Gatekeeper)
        run: |
          codesign --force --deep --sign - "dist/RenombradorXML.app"

      - name: Comprimir la app (ditto preserva symlinks y firma)
        run: |
          cd dist
          ditto -c -k --sequesterRsrc --keepParent RenombradorXML.app RenombradorXML-macOS.zip

      - name: Subir artefacto
        uses: actions/upload-artifact@v4
        with:
          name: RenombradorXML-macOS
          path: dist/RenombradorXML-macOS.zip

      - name: Crear release (solo si el push es un tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/RenombradorXML-macOS.zip
